name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

# 发布 Release 需要写权限（默认 token 在部分仓库设置下是只读的）
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      # 图标已随仓库提交，这里只做一次诊断性渲染；失败不影响构建
      - name: 图标自检（不阻塞）
        continue-on-error: true
        env:
          ICON_OUT: ${{ runner.temp }}/icons
        run: python tools/make_icon.py

      - name: 打包 .app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name DesktopPet \
            --icon assets/DesktopPet.icns \
            --osx-bundle-identifier com.lindong.desktoppet \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtOpenGL \
            --exclude-module tkinter \
            main.py

      - name: 压成 zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/DesktopPet.app DesktopPet-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-macOS
          path: DesktopPet-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      # 直接用仓库里已生成的 ico，不再现算；下面这步只用于排查
      - name: 图标自检（不阻塞）
        continue-on-error: true
        env:
          ICON_OUT: ${{ runner.temp }}/icons
        run: python tools/make_icon.py

      - name: 打包 exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DesktopPet `
            --icon assets/DesktopPet.ico `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.QtSql `
            --exclude-module PySide6.QtTest `
            --exclude-module PySide6.QtDesigner `
            --exclude-module PySide6.QtOpenGL `
            --exclude-module tkinter `
            main.py

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-Windows
          path: dist/DesktopPet.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布
  # 打 tag（v1.0.0）→ 发正式 Release
  # 推分支 / 手动触发 → 更新滚动的 latest Release（文件名固定，下载链接永久有效）
  release:
    name: 发布到 Releases
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物
        run: |
          mkdir -p out
          cp artifacts/DesktopPet-macOS/DesktopPet-macOS.zip out/
          cp artifacts/DesktopPet-Windows/DesktopPet.exe out/DesktopPet-Windows.exe
          ls -lh out

      - name: 生成说明
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          SHORT="${SHA:0:7}"
          {
            echo '### 下载'
            echo
            echo '| 平台 | 文件 | 说明 |'
            echo '| --- | --- | --- |'
            echo '| Windows 10/11 | `DesktopPet-Windows.exe` | 双击即用，不用装 Python |'
            echo '| macOS | `DesktopPet-macOS.zip` | 解压后把 DesktopPet.app 拖进「应用程序」 |'
            echo
            echo '### 第一次打开被系统拦住怎么办'
            echo
            echo '- **macOS**：安装包没有苹果开发者签名。解压后**右键点 DesktopPet.app → 打开 → 再点「打开」**。'
            echo '  若提示「已损坏」，在终端执行 `xattr -dr com.apple.quarantine /Applications/DesktopPet.app`。'
            echo '- **Windows**：提示「Windows 已保护你的电脑」时，点「更多信息 → 仍要运行」。'
            echo
            echo '### 本次构建'
            echo
            echo "- 构建时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')（北京时间）"
            echo "- 提交：[\`${SHORT}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${SHA})"
            if [ "$IS_TAG" = "true" ]; then
              echo "- 版本：\`${REF_NAME}\`"
            else
              echo "- 来源：\`${REF_NAME}\` 分支的最新提交，每次推送都会覆盖本页的两个安装包"
            fi
          } > notes.md
          cat notes.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            TAG="$REF_NAME"
            TITLE="DesktopPet $REF_NAME"
            TARGET=()          # tag 已由 push 创建，不再指定 target
          else
            TAG="latest"
            TITLE="DesktopPet 最新构建"
            TARGET=(--target "$SHA")
          fi

          # 无论是正式版还是滚动版，都标成 Latest：
          # 谁最后构建，/releases/latest 就指向谁，下载页永远不会停留在旧包上
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file notes.md --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file notes.md \
              "${TARGET[@]}" --latest
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            out/DesktopPet-Windows.exe out/DesktopPet-macOS.zip --clobber
