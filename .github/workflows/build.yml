name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    name: macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: 生成图标
        run: python tools/make_icon.py

      - name: 打包 .app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name DesktopPet \
            --icon assets/DesktopPet.icns \
            --osx-bundle-identifier com.lindong.desktoppet \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtOpenGL \
            --exclude-module tkinter \
            main.py

      - name: 压成 zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/DesktopPet.app DesktopPet-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-macOS
          path: DesktopPet-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: 生成图标
        run: python tools/make_icon.py

      - name: 打包 exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DesktopPet `
            --icon assets/DesktopPet.ico `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.QtSql `
            --exclude-module PySide6.QtTest `
            --exclude-module PySide6.QtDesigner `
            --exclude-module PySide6.QtOpenGL `
            --exclude-module tkinter `
            main.py

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-Windows
          path: dist/DesktopPet.exe
          if-no-files-found: error
